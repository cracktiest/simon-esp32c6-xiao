; SIMON-8.4.0-XIAO-EXT-ANT-C6
; Setara menu Arduino IDE:
;   Board            : XIAO ESP32C6
;   Zigbee Mode      : Zigbee ED (end device)
;   Partition Scheme : Zigbee 4MB with spiffs
;   Erase All Flash  : Disabled
;
; espressif32 8.x memakai Arduino-ESP32 3.3.x, yang sudah
; menyertakan stack Zigbee. PIO_ARDUINO_ZIGBEE_MODE_ED membuat
; core menambahkan -DZIGBEE_MODE_ED sekaligus menautkan
; library End Device. Jangan tulis ZIGBEE_MODE_ED langsung:
; core 3.3.12 akan melewati penautan library Zigbee.
; Partisi zigbee.csv berisi app, SPIFFS, zb_storage, dan zb_fct.
;
; Board seeed_xiao_esp32c6 sudah mengatur USB CDC On Boot,
; flash 4MB QIO 80 MHz, dan CPU 160 MHz.

[env:seeed_xiao_esp32c6]
platform = espressif32@^8.0.0
board = seeed_xiao_esp32c6
framework = arduino

monitor_speed = 115200
upload_speed = 460800
monitor_filters = esp32_exception_decoder

board_build.partitions = zigbee.csv
board_build.filesystem = spiffs
board_upload.maximum_size = 1310720

build_flags =
    -D PIO_ARDUINO_ZIGBEE_MODE_ED

lib_deps =
    marcoschwartz/LiquidCrystal_I2C@1.1.4
